<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勁梅演光 Panda'Spectrum - 專業Flow Art 道具工作室</title>
    <style>
        :root {
            --theme-glow: rgba(165, 243, 252, 0.14);
            --theme-accent: #a5f3fc;
            --bg-base: #0a0a0f;
            --card-bg: rgba(22, 22, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f5;
            --text-sub: #8e8e9f;
        }

        /* 8 大主題色定義 */
        body[data-theme="led"]       { --theme-glow: rgba(165, 243, 252, 0.14); --theme-accent: #a5f3fc; } /* 青白 */
        body[data-theme="fire"]      { --theme-glow: rgba(255, 59, 48, 0.16);   --theme-accent: #ff3b30; } /* 紅 */
        body[data-theme="portfolio"] { --theme-glow: rgba(255, 149, 0, 0.15);   --theme-accent: #ff9500; } /* 橙 */
        body[data-theme="parts"]     { --theme-glow: rgba(255, 214, 10, 0.14);  --theme-accent: #ffd60a; } /* 黃 */
        body[data-theme="agency"]    { --theme-glow: rgba(48, 209, 88, 0.15);   --theme-accent: #30d158; } /* 綠 */
        body[data-theme="service"]   { --theme-glow: rgba(10, 132, 255, 0.15);  --theme-accent: #0a84ff; } /* 藍 */
        body[data-theme="tutorial"]  { --theme-glow: rgba(191, 90, 242, 0.16);  --theme-accent: #bf5af2; } /* 紫 */
        body[data-theme="about"]     { --theme-glow: rgba(224, 195, 252, 0.18); --theme-accent: #e0c3fc; } /* 紫白 */

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, var(--theme-glow), transparent 70%);
            transition: background-image 0.5s ease;
        }

        /* 頂部導覽列 */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            flex-shrink: 0;
        }
        .brand-logo {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: none;
        }
        .brand-text-block {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }
        .brand-main {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .brand-sub {
            font-size: 0.68rem;
            color: var(--text-sub);
            letter-spacing: 0.3px;
        }

        /* 8大類別標籤 (橫向滑動支援) */
        nav.nav-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 2px 0;
        }
        nav.nav-bar::-webkit-scrollbar { display: none; }
        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-btn.active {
            color: #000;
            background: var(--theme-accent);
            font-weight: 600;
            box-shadow: 0 0 12px var(--theme-accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-icon-compact {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 5px 9px;
            border-radius: 14px;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
            height: 30px;
        }
        .btn-icon-compact:hover { border-color: var(--theme-accent); }
        
        .music-btn.playing {
            color: var(--theme-accent);
            border-color: var(--theme-accent);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(165, 243, 252, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(165, 243, 252, 0); }
            100% { box-shadow: 0 0 0 0 rgba(165, 243, 252, 0); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex: 1;
            gap: 24px;
            width: 100%;
        }

        aside.sidebar {
            width: 240px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            padding: 0 6px 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .item-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 9px 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.88rem;
        }
        .item-btn:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        .item-btn.active {
            color: #fff;
            border-color: var(--theme-accent);
            background: rgba(255,255,255,0.04);
            box-shadow: inset 3px 0 0 var(--theme-accent);
        }

        main.main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 0;
        }

        .carousel-wrapper {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            min-height: 280px;
        }
        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide {
            flex: 0 0 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b12;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 等比例完整顯示不被切裁 */
            user-select: none;
            -webkit-user-drag: none;
            background-color: #0b0b12;
        }

        .hero-card {
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(20,20,30,0.95), rgba(10,10,18,0.95));
            border-left: 3px solid var(--theme-accent);
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }
        .hero-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .hero-tag {
            font-size: 0.72rem;
            background: rgba(255,255,255,0.08);
            padding: 2px 7px;
            border-radius: 4px;
            color: var(--theme-accent);
        }
        .hero-title { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        
        /* 核心描述：支援 \n 自動換行 */
        .hero-desc { 
            font-size: 0.88rem; 
            color: var(--text-sub); 
            line-height: 1.6; 
            margin-bottom: 12px;
            white-space: pre-line; 
        }
        .manual-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--theme-accent);
            text-decoration: none;
            background: rgba(255,255,255,0.05);
            padding: 5px 11px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .carousel-indicator {
            position: absolute;
            bottom: 10px;
            right: 12px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            color: #fff;
            pointer-events: none;
        }

        .compact-action-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .price-badge { font-size: 1.15rem; font-weight: 700; color: var(--theme-accent); }
        .btn-add-cart {
            background: var(--theme-accent);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .deep-dive-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .dive-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
        }
        .dive-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }
        
        /* 深度文字：支援 \n 自動換行 */
        .dive-text { 
            font-size: 0.82rem; 
            color: var(--text-sub); 
            line-height: 1.6; 
            white-space: pre-line; 
        }

        .cart-drawer {
            position: fixed;
            top: 0; right: -360px;
            width: 320px; height: 100vh;
            background: #111118;
            border-left: 1px solid var(--border-color);
            z-index: 200;
            padding: 18px;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .cart-drawer.open { right: 0; }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 6px;
        }
        .cart-footer { border-top: 1px solid var(--border-color); padding-top: 12px; }
        .copy-all-btn {
            background: #28a745;
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.88rem;
        }

        /* 手機版優化 */
        @media (max-width: 768px) {
            .header-inner {
                flex-direction: column;
                align-items: stretch;
                padding: 8px 12px 6px;
                gap: 8px;
            }
            .header-row-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }
            .brand-main { font-size: 1rem; }
            .brand-sub { font-size: 0.62rem; }
            
            nav.nav-bar {
                width: 100%;
                justify-content: flex-start;
                padding-bottom: 2px;
                gap: 6px;
            }
            .nav-btn {
                padding: 4px 10px;
                font-size: 0.78rem;
                flex-shrink: 0;
            }

            .container { flex-direction: column; padding: 12px; gap: 14px; }
            aside.sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
            .item-btn { white-space: nowrap; flex: 0 0 auto; font-size: 0.8rem; padding: 7px 10px; }
            .deep-dive-grid { grid-template-columns: 1fr; }
            .carousel-wrapper { aspect-ratio: 4 / 3; }
        }
    </style>
</head>
<body data-theme="led">

    <header>

    <div class="container">

        </aside>

        <main class="main-content">
            <div class="carousel-wrapper">

                    <div class="dive-text" id="dive-text-2">正在載入詳細內容...</div>
                </div>
            </div>
        </main>
    </div>

    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3 style="font-size:1rem;">🛒 詢問清單</h3>
            <button onclick="toggleCartDrawer()" style="background:none; border:none; color:#fff; font-size:1.1rem; cursor:pointer;">✕</button>
        </div>
        <div class="cart-items" id="cart-list-container">
            <p style="color:var(--text-sub); font-size:0.8rem;">目前無商品</p>
        </div>
        <div class="cart-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.85rem;">

            </div>
            <button class="copy-all-btn" onclick="copyCartText()">📋 複製清單</button>
        </div>
    </div>

                    dive2_en: "Follow our social channels for workshops, maintenance tutorials, and stage updates."

        let currentCat = 'led';
        let currentItem = database.led[0];
        let cart = {};

        window.addEventListener('DOMContentLoaded', () => {
            setupNavigation();
            renderCategory(currentCat);
            
            const track = document.getElementById('carousel-track');
            track.addEventListener('scroll', () => {
                const index = Math.round(track.scrollLeft / track.clientWidth);
                const total = track.children.length;
                document.getElementById('carousel-num').innerText = `${index + 1} / ${total}`;
            });
        });

        function setupNavigation() {
            const buttons = document.querySelectorAll('#top-nav .nav-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const cat = btn.dataset.cat;
                    const theme = btn.dataset.theme;
                    document.body.setAttribute('data-theme', theme);
                    currentCat = cat;
                    renderCategory(cat);
                });
            });
        }

        function renderCategory(catKey) {
            const items = database[catKey] || [];
            const sidebarContainer = document.getElementById('sidebar-items');
            sidebarContainer.innerHTML = '';

            // 作品、服務、教學、勁梅 類別自動隱藏選購欄
            const purchaseBar = document.getElementById('purchase-bar');
            const noBuyCats = ['portfolio', 'service', 'tutorial', 'about'];
            if (noBuyCats.includes(catKey)) {
                purchaseBar.style.display = 'none';
            } else {
                purchaseBar.style.display = 'flex';
            }

            items.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `item-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = currentLang === 'zh' ? item.name_zh : item.name_en;
                btn.onclick = () => {
                    document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadItemDetails(item);
                };
                sidebarContainer.appendChild(btn);
            });

            if (items.length > 0) {
                loadItemDetails(items[0]);
            }
        }

        async function loadItemDetails(item) {
            currentItem = item;
            document.getElementById('product-price').innerText = item.price > 0 ? `$${item.price}` : '客製討論';
            document.getElementById('dive-text-1').innerText = currentLang === 'zh' ? item.dive1_zh : item.dive1_en;
            document.getElementById('dive-text-2').innerText = currentLang === 'zh' ? item.dive2_zh : item.dive2_en;

            const track = document.getElementById('carousel-track');
            track.innerHTML = '';

            const tags = currentLang === 'zh' ? item.tags_zh : item.tags_en;
            const title = currentLang === 'zh' ? item.name_zh : item.name_en;
            const desc = currentLang === 'zh' ? item.desc_zh : item.desc_en;

            const manualBtnHtml = (item.manualUrl && item.manualUrl.trim() !== "")
                ? `<a href="${item.manualUrl}" target="_blank" class="manual-link-btn">📖 ${currentLang === 'zh' ? '詳細介紹' : 'Documentation'} ↗</a>` 
                : '';

            const heroSlide = document.createElement('div');
            heroSlide.className = 'carousel-slide';
            heroSlide.innerHTML = `
                <div class="hero-card">
                    <div>
                        <div class="hero-tags">
                            ${tags.map(t => `<span class="hero-tag">${t}</span>`).join('')}
                        </div>
                        <div class="hero-title">${title}</div>
                        <div class="hero-desc">${desc}</div>
                    </div>
                    ${manualBtnHtml}
                </div>
            `;
            track.appendChild(heroSlide);

            const images = await probeSequenceImages(item.imgPrefix);
            if (images.length === 0) {
                images.push(createSvgFallback(title));
            }

            images.forEach(src => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `<img src="${src}" alt="${title}">`;
                track.appendChild(slide);
            });

            track.scrollLeft = 0;
            document.getElementById('carousel-num').innerText = `1 / ${track.children.length}`;
        }

        async function probeSequenceImages(prefix, max = 10) {
            const results = [];
            for (let i = 1; i <= max; i++) {
                const num = String(i).padStart(2, '0');
                const url = `${prefix}${num}.jpg`;
                const exists = await checkImageExists(url);
                if (exists) results.push(url);
                else break;
            }
            return results;
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function createSvgFallback(title) {
            const encoded = encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
                    <rect width="800" height="450" fill="#0b0b12"/>
                    <circle cx="400" cy="225" r="70" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
                    <text x="400" y="230" fill="rgba(255,255,255,0.3)" font-size="15" font-family="sans-serif" text-anchor="middle">
                        [ 圖片庫: ${title} ]
                    </text>
                </svg>
            `);
            return `data:image/svg+xml;utf8,${encoded}`;
        }

        /* 語系切換：就地更新，不彈回首張圖片 */
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-text').innerText = currentLang === 'zh' ? 'TW' : 'EN';

            const items = database[currentCat] || [];
            const sidebarBtns = document.querySelectorAll('#sidebar-items .item-btn');
            items.forEach((item, index) => {
                if (sidebarBtns[index]) {
                    sidebarBtns[index].innerText = currentLang === 'zh' ? item.name_zh : item.name_en;
                }
            });

            if (currentItem) {
                document.getElementById('dive-text-1').innerText = currentLang === 'zh' ? currentItem.dive1_zh : currentItem.dive1_en;
                document.getElementById('dive-text-2').innerText = currentLang === 'zh' ? currentItem.dive2_zh : currentItem.dive2_en;

                const heroCard = document.querySelector('.carousel-slide .hero-card');
                if (heroCard) {
                    const tags = currentLang === 'zh' ? currentItem.tags_zh : currentItem.tags_en;
                    const title = currentLang === 'zh' ? currentItem.name_zh : currentItem.name_en;
                    const desc = currentLang === 'zh' ? currentItem.desc_zh : currentItem.desc_en;

                    const tagsContainer = heroCard.querySelector('.hero-tags');
                    if (tagsContainer) {
                        tagsContainer.innerHTML = tags.map(t => `<span class="hero-tag">${t}</span>`).join('');
                    }
                    const titleEl = heroCard.querySelector('.hero-title');
                    if (titleEl) titleEl.innerText = title;

                    const descEl = heroCard.querySelector('.hero-desc');
                    if (descEl) descEl.innerText = desc;

                    const manualBtn = heroCard.querySelector('.manual-link-btn');
                    if (manualBtn) {
                        manualBtn.innerHTML = `📖 ${currentLang === 'zh' ? '詳細介紹' : 'Documentation'} ↗`;
                    }
                }
            }

            updateCartUI();
        }

        function toggleAudio() {
            const audio = document.getElementById('bgm-player');
            const btn = document.getElementById('music-btn');
            const status = document.getElementById('music-status');

            if (audio.paused) {
                audio.play().then(() => {
                    btn.classList.add('playing');
                    status.innerText = 'ON';
                }).catch(err => {
                    console.warn("找不到音訊檔案或被阻擋：", err);
                    alert("請確認專案資料夾內已放置 audio/bgm.mp3 檔案！");
                });
            } else {
                audio.pause();
                btn.classList.remove('playing');
                status.innerText = 'BGM';
            }
        }

        function addToCartCurrent() {
            if (!currentItem || currentItem.price === 0) return;
            cart[currentItem.id] = (cart[currentItem.id] || 0) + 1;
            updateCartUI();
            toggleCartDrawer(true);
        }

        function updateCartUI() {
            let count = 0;
            let total = 0;
            const container = document.getElementById('cart-list-container');
            container.innerHTML = '';

            const allProducts = Object.values(database).flat();

            Object.keys(cart).forEach(id => {
                const qty = cart[id];
                count += qty;
                const prod = allProducts.find(p => p.id === id);
                if (prod) {
                    const subtotal = prod.price * qty;
                    total += subtotal;

                    const row = document.createElement('div');
                    row.className = 'cart-row';
                    row.innerHTML = `
                        <div>
                            <div>${currentLang === 'zh' ? prod.name_zh : prod.name_en}</div>
                            <div style="color:var(--text-sub); font-size:0.75rem;">$${prod.price} × ${qty}</div>
                        </div>
                        <div style="font-weight:bold; color:var(--theme-accent);">$${subtotal}</div>
                    `;
                    container.appendChild(row);
                }
            });

            document.getElementById('cart-counter').innerText = count;
            document.getElementById('cart-drawer-total').innerText = `$${total}`;
        }

        function toggleCartDrawer(forceOpen = false) {
            const drawer = document.getElementById('cart-drawer');
            if (forceOpen) drawer.classList.add('open');
            else drawer.classList.toggle('open');
        }

        function copyCartText() {
            const allProducts = Object.values(database).flat();
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert('清單內尚無商品！');
                return;
            }

            let text = `👋 您好！我想向【勁梅演光】諮詢以下品項：\n`;
            text += `=========================\n`;
            let total = 0;
            keys.forEach(id => {
                const p = allProducts.find(item => item.id === id);
                const qty = cart[id];
                const sub = p.price * qty;
                total += sub;
                text += `🔸 ${p.name_zh} × ${qty} ($${sub})\n`;
            });
            text += `=========================\n`;
            text += `💰 預估金額：$${total}\n\n`;
            text += `（備註：長度規格 / 特殊訂製需求請在此填寫）`;

            navigator.clipboard.writeText(text).then(() => {
                alert('清單已成功複製！請直接前往 FB / IG 私訊貼上進行討論 👌');
            });
        }
    </script>
