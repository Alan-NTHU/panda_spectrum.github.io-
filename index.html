<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勁梅演光 Panda'Spectrum - 專業Flow Art 道具工作室</title>
    <!-- 本地引入 papaparse -->
    <script src="papaparse.min.js"></script>
    <style>
        :root {
            --theme-glow: rgba(165, 243, 252, 0.14);
            --theme-accent: #a5f3fc;
            --bg-base: #0a0a0f;
            --card-bg: rgba(22, 22, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f0f0f5;
            --text-sub: #8e8e9f;
        }

        /* 8 大主題色定義 */
        body[data-theme="led"]       { --theme-glow: rgba(165, 243, 252, 0.14); --theme-accent: #a5f3fc; } /* 青白 */
        body[data-theme="fire"]      { --theme-glow: rgba(255, 59, 48, 0.16);   --theme-accent: #ff3b30; } /* 紅 */
        body[data-theme="portfolio"] { --theme-glow: rgba(255, 149, 0, 0.15);   --theme-accent: #ff9500; } /* 橙 */
        body[data-theme="parts"]     { --theme-glow: rgba(255, 214, 10, 0.14);  --theme-accent: #ffd60a; } /* 黃 */
        body[data-theme="agency"]    { --theme-glow: rgba(48, 209, 88, 0.15);   --theme-accent: #30d158; } /* 綠 */
        body[data-theme="service"]   { --theme-glow: rgba(10, 132, 255, 0.15);  --theme-accent: #0a84ff; } /* 藍 */
        body[data-theme="tutorial"]  { --theme-glow: rgba(191, 90, 242, 0.16);  --theme-accent: #bf5af2; } /* 紫 */
        body[data-theme="about"]     { --theme-glow: rgba(224, 195, 252, 0.18); --theme-accent: #e0c3fc; } /* 紫白 */

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* 核心優化：固定視窗頂端的光暈球體，完全無直線接縫 */
        .ambient-glow {
            position: fixed;
            top: -160px;
            left: 50%;
            transform: translateX(-50%);
            width: 650px;
            height: 380px;
            background: radial-gradient(ellipse at center, var(--theme-accent) 0%, transparent 72%);
            opacity: 0.16;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
            transition: background 0.6s ease, opacity 0.6s ease;
        }

        /* 頂部導覽列 */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            flex-shrink: 0;
        }
        .brand-logo {
            width: 26px;
            height: 26px;
            object-fit: contain;
            display: none;
        }
        .brand-text-block {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }
        .brand-main {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .brand-sub {
            font-size: 0.68rem;
            color: var(--text-sub);
            letter-spacing: 0.3px;
        }

        /* 8大類別標籤 */
        nav.nav-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 2px 0;
        }
        nav.nav-bar::-webkit-scrollbar { display: none; }
        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-btn.active {
            color: #000;
            background: var(--theme-accent);
            font-weight: 600;
            box-shadow: 0 0 12px var(--theme-accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-icon-compact {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 5px 9px;
            border-radius: 14px;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
            height: 30px;
        }
        .btn-icon-compact:hover { border-color: var(--theme-accent); }

        .music-btn.playing {
            color: var(--theme-accent);
            border-color: var(--theme-accent);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(165, 243, 252, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(165, 243, 252, 0); }
            100% { box-shadow: 0 0 0 0 rgba(165, 243, 252, 0); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex: 1;
            gap: 24px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* 側邊欄結構 */
        aside.sidebar {
            width: 240px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            padding: 0 6px 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .item-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 9px 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.88rem;
        }
        .item-btn:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        .item-btn.active {
            color: #fff;
            border-color: var(--theme-accent);
            background: rgba(255,255,255,0.04);
            box-shadow: inset 3px 0 0 var(--theme-accent);
        }

        main.main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-width: 0;
        }

        .carousel-wrapper {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            min-height: 280px;
        }
        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide {
            flex: 0 0 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b12;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            background-color: #0b0b12;
        }

        .hero-card {
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(20,20,30,0.95), rgba(10,10,18,0.95));
            border-left: 3px solid var(--theme-accent);
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }
        .hero-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .hero-tag {
            font-size: 0.72rem;
            background: rgba(255,255,255,0.08);
            padding: 2px 7px;
            border-radius: 4px;
            color: var(--theme-accent);
        }
        .hero-title { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
        
        .hero-desc { 
            font-size: 0.88rem; 
            color: var(--text-sub); 
            line-height: 1.6; 
            margin-bottom: 12px;
            white-space: pre-line; 
        }
        .manual-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--theme-accent);
            text-decoration: none;
            background: rgba(255,255,255,0.05);
            padding: 5px 11px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .carousel-indicator {
            position: absolute;
            bottom: 10px;
            right: 12px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.72rem;
            color: #fff;
            pointer-events: none;
        }

        .compact-action-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .price-badge { font-size: 1.15rem; font-weight: 700; color: var(--theme-accent); }
        .btn-add-cart {
            background: var(--theme-accent);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .deep-dive-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .dive-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
        }
        .dive-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }
